name: Publish NPM Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-publish:
    name: Build and Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: selenium-mcp-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

      - name: Create deployment summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "## NPM Package Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`selenium-ai-agent@$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install selenium-ai-agent" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Tag the published version and create its GitHub release (notes from the CHANGELOG).
  # Only for a manual run: a run started by a published release already has one.
  # A release created with GITHUB_TOKEN does not start this workflow again.
  github-release:
    name: Create GitHub release
    needs: build-and-publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Release notes from the CHANGELOG
        run: |
          VERSION=$(node -p "require('./selenium-mcp-server/package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' selenium-mcp-server/CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Published selenium-ai-agent@$VERSION on npm." > notes.md
          fi
          printf '\n**npm:** [selenium-ai-agent@%s](https://www.npmjs.com/package/selenium-ai-agent/v/%s)\n' "$VERSION" "$VERSION" >> notes.md

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"; exit 0
          fi
          gh release create "v$VERSION" --target "${{ github.sha }}" --title "v$VERSION" --notes-file notes.md --latest
          echo "## GitHub release v$VERSION created" >> "$GITHUB_STEP_SUMMARY"

  # Publish the server metadata to the official MCP Registry
  # (https://registry.modelcontextprotocol.io) once the npm package is live.
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC login for the io.github.learn-automated-testing namespace
      contents: read
    defaults:
      run:
        working-directory: selenium-mcp-server
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync server.json version with package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The registry checks the published npm package for a matching mcpName.
      - name: Wait for the npm package
        run: |
          for i in $(seq 1 30); do
            NAME=$(npm view "selenium-ai-agent@${VERSION}" mcpName 2>/dev/null || true)
            if [ "$NAME" = "io.github.learn-automated-testing/selenium-ai-agent" ]; then
              echo "selenium-ai-agent@${VERSION} is live with mcpName"; exit 0
            fi
            echo "Waiting for selenium-ai-agent@${VERSION} on npm ($i/30)..."; sleep 10
          done
          echo "selenium-ai-agent@${VERSION} not found on npm with the expected mcpName"; exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
